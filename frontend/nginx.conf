server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fotos originais do drone tem ~12 MB; o padrao do nginx (1 MB) as recusaria.
    client_max_body_size 50m;

    # A API: o navegador fala so com este nginx, que repassa ao backend pela rede
    # interna do Docker ("backend" e o nome do servico no docker-compose.yml).
    # Mesmo endereco para pagina e API = sem CORS, e funciona de outro computador.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # cada foto leva ~13 s, mais a fila quando ha varias; o padrao (60 s)
        # cortaria a resposta com a maquina ocupada
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Arquivos do build tem hash no nome: podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # A resposta da API e um JSON com a imagem em base64 (~9 MB); comprimir
    # ajuda pouco na imagem, mas nao custa nada para o resto.
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
}
